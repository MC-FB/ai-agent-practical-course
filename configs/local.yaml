llm:
  provider: gemini
  model: gemini/gemini-2.0-flash
  temperature: 0.0
  api_key_env: GEMINI_API_KEY
planner:
  max_nodes: 10
  max_depth: 3
  repair_rounds: 1
execution:
  max_parallel_nodes: 4
  node_timeout_seconds: 45
  node_repair_rounds: 1
  fail_fast: false
validation:
  structural_only: true
benchmark:
  dataset: hotpotqa
  split: validation
  default_limit: 100
  output_dir: runs/benchmarks
