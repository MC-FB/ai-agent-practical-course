llm:
  provider: azure_openai
  model: azure/gpt-4o-mini
  model_env: AZURE_OPENAI_MODEL
  temperature: 0.0
  api_key_env: AZURE_OPENAI_API_KEY
  api_base_env: AZURE_OPENAI_ENDPOINT
  api_version_env: AZURE_OPENAI_API_VERSION
  request_timeout_seconds: 180
  max_retries: 8
  retry_initial_delay_seconds: 2
  retry_max_delay_seconds: 120
planner:
  max_nodes: 10
  max_depth: 3
  repair_rounds: 1
execution:
  max_parallel_nodes: 4
  node_timeout_seconds: 120
  node_repair_rounds: 1
  fail_fast: false
validation:
  structural_only: true
benchmark:
  dataset: hotpotqa
  split: validation
  default_limit: 100
  max_parallel_examples: 4
  empty_prediction_retries: 1
  output_dir: runs/benchmarks
