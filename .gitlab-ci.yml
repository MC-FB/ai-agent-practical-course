stages:
  - test
  - build
  - smoke

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

variables:
  SECRET_DETECTION_ENABLED: 'true'
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip
    - app/web/node_modules/

pre_commit:
  stage: test
  image: python:3.13-slim
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev]"
  script:
    - pre-commit run --all-files

unit_tests:
  stage: test
  image: python:3.13-slim
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev]"
  script:
    - pytest tests/unit

web_build:
  stage: build
  image: node:22
  script:
    - npm --prefix app/web ci
    - npm --prefix app/web run build

docker_build_and_smoke:
  stage: smoke
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache curl
  script:
    - docker build -t dagqa-ci .
    - docker run --rm -d --name dagqa-ci -p 8000:8000 dagqa-ci
    - |
      for attempt in $(seq 1 30); do
        if curl -fsS http://docker:8000/api/config; then
          exit 0
        fi
        sleep 1
      done
      docker logs dagqa-ci
      exit 1

include:
  - template: Security/Secret-Detection.gitlab-ci.yml
