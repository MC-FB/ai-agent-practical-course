services:
  dagqa:
    container_name: dagqa-app
    image: dagqa-app:latest
    build:
      context: .
      target: backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      HF_HOME: /app/hf_cache
      SENTENCE_TRANSFORMERS_HOME: /app/hf_cache/sentence-transformers
    volumes:
      - ./runs:/app/runs
      - hf-model-cache:/app/hf_cache

  test:
    build:
      context: .
      target: test
    env_file:
      - .env
    environment:
      HF_HOME: /app/hf_cache
      SENTENCE_TRANSFORMERS_HOME: /app/hf_cache/sentence-transformers
    volumes:
      - ./tests:/app/tests
      - hf-model-cache:/app/hf_cache
    profiles:
      - test

volumes:
  dagqa-runs:
  hf-model-cache:
